version: '3.8'

services:
  # 1. Zookeeper (Diperlukan untuk koordinasi Apache Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 2. Apache Kafka (Message Broker untuk aliran data telemetri real-time)
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. MongoDB (Database NoSQL untuk Time-Series Collection)
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 4. FastAPI Backend (Menyajikan API dan Query ke MongoDB)
  backend:
    build: ./backend
    container_name: f1-backend
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      - kafka
      - mongodb

  # 5. Frontend React.js / Vue.js (Dashboard Tampilan Live Chart)
  frontend:
    build: ./frontend
    container_name: f1-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data: